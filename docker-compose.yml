# LOCAL DEVELOPMENT ONLY. Starts PostgreSQL, the Tuition API, the MCP server and the agent.
# There is no API gateway in this file: the agent calls the API directly (GATEWAY_SECRET is empty, so the
# API does not require X-Gateway-Secret). In the cloud deployment every REST call goes through Azure API
# Management - see README.md and docs/deployment.md.
#
#   cp .env.example .env   # fill in the CHANGE_ME values
#   docker compose up --build
#   open http://localhost:3200   (agent UI), http://localhost:3000/api-docs (Swagger)
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: tuition
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tuition"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - dbdata:/var/lib/postgresql/data

  api:
    build: ./api
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/tuition
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      GATEWAY_SECRET: ${GATEWAY_SECRET:-}
      SEED_DEMO_DATA: "true"
      SEED_STUDENT_PASSWORD: ${SEED_STUDENT_PASSWORD:?set SEED_STUDENT_PASSWORD in .env}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?set SEED_ADMIN_PASSWORD in .env}
    ports:
      - "3000:3000"

  mcp:
    build: ./mcp-server
    environment:
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:-}
    ports:
      - "3100:3100"

  agent:
    build: ./agent
    depends_on:
      - api
      - mcp
    environment:
      GATEWAY_URL: ${GATEWAY_URL:-http://api:3000}
      MCP_URL: ${MCP_URL:-http://mcp:3100/mcp}
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:?set GEMINI_API_KEY in .env}
      LLM_MODEL: ${LLM_MODEL:-gemini-flash-latest}
    ports:
      - "3200:3200"

volumes:
  dbdata:
