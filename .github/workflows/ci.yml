name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tuition_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: API unit tests (no database, no cloud, no LLM)
        working-directory: api
        run: npm ci && npm test
      - name: API integration tests (real PostgreSQL service container)
        working-directory: api
        run: npm run test:integration
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/tuition_test
      - name: MCP server tests
        working-directory: mcp-server
        run: npm ci && npm test
      - name: Agent tests (scripted LLM)
        working-directory: agent
        run: npm ci && npm test
