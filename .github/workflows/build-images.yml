name: build-images

# Builds the three service images and publishes them to GitHub Container Registry.
# Azure Container Apps pulls ghcr.io/<owner>/tuition-{api,mcp,agent}:latest (packages must be public).
on:
  push:
    branches: [main]
    paths: ["api/**", "mcp-server/**", "agent/**", ".github/workflows/build-images.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { name: tuition-api, dir: api }
          - { name: tuition-mcp, dir: mcp-server }
          - { name: tuition-agent, dir: agent }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.dir }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:latest
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
